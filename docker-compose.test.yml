services:
  postgres-test:
    image: postgres:16-alpine
    container_name: trasir-postgres-test
    environment:
      POSTGRES_USER: trasir_test
      POSTGRES_PASSWORD: trasir_test_password
      POSTGRES_DB: trasir_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trasir_test -d trasir_test"]
      interval: 2s
      timeout: 3s
      retries: 15

